version: '3.8'

networks:
  ardd_net:
    driver: bridge

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ardd_net
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - ardd_net
    restart: unless-stopped

  ingest-gateway:
    build:
      context: ./ingest-gateway
      dockerfile: Dockerfile
    container_name: ingest-gateway
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_FRAMES=frames
      - KAFKA_CONSUMER_GROUP=vision-service-group
      - RTSP_SOURCE=${RTSP_SOURCE:-rtsp://localhost:8554/stream}
      - FPS_TARGET=30
      - FPS_DOWNSAMPLE_THRESHOLD=500
    networks:
      - ardd_net
    restart: unless-stopped

  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile
    container_name: vision-service
    depends_on:
      - kafka
    ports:
      - "8001:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_FRAMES=frames
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - MODEL_WEIGHTS_PATH=/app/weights/efficientnet_b4.pth
    networks:
      - ardd_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  rag-agent:
    build:
      context: ./rag-agent
      dockerfile: Dockerfile
    container_name: rag-agent
    depends_on:
      - ollama
    ports:
      - "8002:8002"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - OLLAMA_HOST=http://ollama:11434
      - MOCK_LLM=${MOCK_LLM:-true}
    networks:
      - ardd_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  aggregation-service:
    build:
      context: ./aggregation-service
      dockerfile: Dockerfile
    container_name: aggregation-service
    depends_on:
      vision-service:
        condition: service_healthy
      rag-agent:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      # These env var names must match aggregation-service/main.py
      - VISION_URL=http://vision-service:8001/infer
      - RAG_URL=http://rag-agent:8002/audit
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_LABELS=labels
      - WEBHOOK_URL=${WEBHOOK_URL:-}
    networks:
      - ardd_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:2.11.1
    container_name: mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow-artifacts
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_TOKEN=${MLFLOW_TRACKING_TOKEN}
    volumes:
      - ./mlflow-data:/mlflow-artifacts
    networks:
      - ardd_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    networks:
      - ardd_net
    restart: unless-stopped
    # After first start, pull the model:
    # docker exec ollama ollama pull mistral

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      aggregation-service:
        condition: service_healthy
    environment:
      # Vite reads VITE_* env vars at build time via import.meta.env
      - VITE_API_URL=http://aggregation-service:8003
      - VITE_WS_URL=ws://aggregation-service:8003/stream
    ports:
      - "3000:3000"
    networks:
      - ardd_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3