version: '3.8'

networks:
  ardd_net:
    driver: bridge

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ardd_net
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - ardd_net
    restart: unless-stopped

  ingest-gateway:
    build:
      context: ./ingest-gateway
      dockerfile: Dockerfile
    container_name: ingest-gateway
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_FRAMES=frames
      - RTSP_SOURCE=${RTSP_SOURCE:-rtsp://localhost:8554/stream}
      - FPS_TARGET=30
      - FPS_DOWNSAMPLE_THRESHOLD=500
    networks:
      - ardd_net
    restart: unless-stopped

  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile
    container_name: vision-service
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_FRAMES=frames
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - MODEL_WEIGHTS_PATH=/app/weights/efficientnet_b4.pth
    networks:
      - ardd_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  rag-agent:
    build:
      context: ./rag-agent
      dockerfile: Dockerfile
    container_name: rag-agent
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - FAISS_INDEX_PATH=/app/data/threat_signatures.faiss
    networks:
      - ardd_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  aggregation-service:
    build:
      context: ./aggregation-service
      dockerfile: Dockerfile
    container_name: aggregation-service
    depends_on:
      vision-service:
        condition: service_healthy
      rag-agent:
        condition: service_healthy
    environment:
      - VISION_SERVICE_URL=http://vision-service:8001
      - RAG_AGENT_URL=http://rag-agent:8002
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_LABELS=labels
    networks:
      - ardd_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow-artifacts
    environment:
      - MLFLOW_TRACKING_TOKEN=${MLFLOW_TRACKING_TOKEN}
    volumes:
      - ./mlflow-data:/mlflow-artifacts
    networks:
      - ardd_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      - aggregation-service
    environment:
      - REACT_APP_WS_URL=ws://aggregation-service:8003/stream
      - REACT_APP_AUTH_URL=http://aggregation-service:8003/auth/token
    ports:
      - "3000:3000"
    networks:
      - ardd_net
    restart: unless-stopped